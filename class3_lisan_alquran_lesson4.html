<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لسان القرآن — الدرس الرابع | പ്രവർത്തനങ്ങൾ</title>
<style>
:root{--navy:#17345c;--pink:#d63378;--gold:#f4c64e;--green:#178747;--red:#d83232;--ink:#172033;--paper:#fffdf8;--line:#e4e8ef}
*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:var(--ink);font-family:Arial,"Noto Sans Malayalam",sans-serif;line-height:1.65}
header{background:linear-gradient(135deg,#17345c,#315d8c);color:white;text-align:center;padding:24px 14px 22px;border-bottom:6px solid var(--gold)}header .brand{font-size:14px;letter-spacing:1px;opacity:.9}header h1{font-size:clamp(24px,5vw,36px);margin:5px 0;color:#fff}header .lesson{display:inline-block;background:var(--gold);color:#242424;padding:3px 15px;border-radius:20px;font-weight:bold}
main{max-width:900px;margin:20px auto;padding:0 12px}.intro,.quiz-card,.bottom{background:white;border-radius:16px;box-shadow:0 5px 18px #17345c12;padding:17px;margin-bottom:15px}.intro{text-align:center}.intro p{margin:6px 0}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.stat{background:#eef4fb;border-radius:10px;padding:7px 13px;font-weight:bold}.progress-wrap{height:10px;background:#e5eaf1;border-radius:20px;overflow:hidden;margin-top:13px}.progress{height:100%;width:0;background:linear-gradient(90deg,#22a45a,#87cf68);transition:width .25s}
.quiz-card{border:1px solid var(--line)}.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.qnum{background:var(--navy);color:white;border-radius:20px;padding:3px 11px;font-size:14px;white-space:nowrap}.prompt{font-weight:bold;font-size:17px;margin:12px 0 10px}.arabic{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:clamp(23px,4.5vw,29px);line-height:1.9;text-align:right;direction:rtl;color:#111;margin:8px 0}.arabic .blank{display:inline-block;min-width:82px;border-bottom:2px dotted #9b315c;color:#b52d62;text-align:center;padding:0 4px;margin:0 3px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{border:2px solid #d8e0eb;background:#fff;border-radius:11px;padding:10px 12px;cursor:pointer;text-align:center;font-size:18px;transition:.15s;min-height:48px}.option:hover{border-color:#7192bc;background:#f4f8fd}.option.correct{background:#e3f8e9;border-color:var(--green);color:#075d2c}.option.wrong{background:#ffebeb;border-color:var(--red);color:#9b1111}.option:disabled{cursor:default}.feedback{display:flex;align-items:center;gap:9px;margin-top:11px;min-height:34px;font-weight:bold}.light{width:17px;height:17px;border-radius:50%;background:#cbd2dc;box-shadow:inset 0 0 0 2px #ffffffa8;flex-shrink:0}.light.green{background:#16a34a;box-shadow:0 0 10px #16a34a88}.light.red{background:#ef3333;box-shadow:0 0 10px #ef333388}.feedback .msg{font-size:15px}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:10px;padding:11px 18px;font-size:16px;font-weight:bold;cursor:pointer}.primary{background:var(--navy);color:white}.secondary{background:#e7edf5;color:#183456}.bottom{text-align:center;color:#566276;font-size:13px}footer{text-align:center;color:#657187;padding:0 12px 22px;font-size:13px}
@media(max-width:520px){.options{grid-template-columns:1fr}.quiz-card{padding:13px}.intro,.bottom{padding:14px}.prompt{font-size:16px}}
</style>
</head>
<body>
<header><div class="brand">لسان القرآن · الصف الثالث</div><h1>فِكْرَةٌ رَائِعَةٌ</h1><div class="lesson"></div></header>
<main>
<section class="intro"><h2 style="margin:0;color:#17345c">അറബി പഠിക്കാം</h2><p>ശരിയായ ഉത്തരം അമർത്തുക. ഉത്തരം ശരിയെങ്കിൽ <b style="color:#178747">പച്ച ലൈറ്റ്</b>, തെറ്റെങ്കിൽ <b style="color:#d83232">ചുവപ്പ് ലൈറ്റ്</b> തെളിയും.</p><div class="stats"><div class="stat">ചോദ്യങ്ങൾ: <span id="total">25</span></div><div class="stat">ഉത്തരം നൽകിയവ: <span id="answered">0</span></div><div class="stat">സ്കോർ: <span id="score">0</span>/25</div></div><div class="progress-wrap"><div class="progress" id="progress"></div></div></section>
<div id="quiz"></div>
<div class="controls"><button class="btn primary" onclick="checkAll()">എല്ലാ ഉത്തരങ്ങളും നോക്കുക</button><button class="btn secondary" onclick="resetQuiz()">വീണ്ടും തുടങ്ങുക</button></div>
<section class="bottom">.</section>
</main><footer>لسان القرآن — الصف الثالث</footer>
<script>
const questions=[
{p:'“مَاذَا نَفْعَلُ الْيَوْمَ؟” എന്നതിന്റെ അർത്ഥം എന്ത്?',a:'ഇന്ന് നാം എന്ത് ചെയ്യും?',o:['ഇന്ന് നാം എന്ത് ചെയ്യും?','നീ എവിടെയാണ്?','നിന്റെ പേരെന്താണ്?','നീ എങ്ങനെ ഇരിക്കുന്നു?']},
{p:'“مَا رَأْيُكَ؟” എന്നതിന്റെ അർത്ഥം എന്ത്?',a:'നിന്റെ അഭിപ്രായം എന്താണ്?',o:['നിന്റെ അഭിപ്രായം എന്താണ്?','നീ എവിടേക്ക് പോകുന്നു?','ആരാണ് വരുന്നത്?','നീ എന്ത് കഴിക്കുന്നു?']},
{p:'“هَلْ نَلْعَبُ بِكُرَةِ الْقَدَمِ؟” എന്നതിന്റെ അർത്ഥം എന്ത്?',a:'നമുക്ക് ഫുട്ബോൾ കളിക്കാമോ?',o:['നമുക്ക് ഫുട്ബോൾ കളിക്കാമോ?','നമുക്ക് ഖുർആൻ വായിക്കാമോ?','നീ സ്കൂളിലാണോ?','പക്ഷികൾ എവിടെയാണ്?']},
{p:'“أَيْنَ الْكُرَةُ؟” എന്നതിലെ أَيْنَ എന്ന വാക്കിന്റെ അർത്ഥം എന്ത്?',a:'എവിടെ',o:['എവിടെ','എന്ത്','ആര്','എങ്ങനെ']},
{p:'“مَنْ يَأْتِي بِالرُّزِّ؟” എന്നതിലെ مَنْ എന്ന വാക്കിന്റെ അർത്ഥം എന്ത്?',a:'ആര്',o:['ആര്','എവിടെ','എന്ത്','എങ്ങനെ']},
{p:'“كَيْفَ نُطْعِمُهَا؟” എന്നതിലെ كَيْفَ എന്ന വാക്കിന്റെ അർത്ഥം എന്ത്?',a:'എങ്ങനെ',o:['എങ്ങനെ','എവിടെ','ആര്','എന്ത്']},
{p:'“هَلْ تُحِبُّ إِطْعَامَ الطُّيُورِ؟” എന്നതിന്റെ അർത്ഥം എന്ത്?',a:'പക്ഷികൾക്ക് ഭക്ഷണം നൽകുന്നത് നിനക്ക് ഇഷ്ടമാണോ?',o:['പക്ഷികൾക്ക് ഭക്ഷണം നൽകുന്നത് നിനക്ക് ഇഷ്ടമാണോ?','നിനക്ക് പന്ത് ഇഷ്ടമാണോ?','നീ എവിടെയാണ് താമസിക്കുന്നത്?','നിന്റെ പേരെന്താണ്?']},
{p:'“نَعَمْ” എന്നതിന്റെ അർത്ഥം എന്ത്?',a:'അതെ',o:['അതെ','ഇല്ല','എവിടെ','ആര്']},
{p:'“لَا أُحِبُّهَا” എന്നതിന്റെ അർത്ഥം എന്ത്?',a:'എനിക്ക് അത് ഇഷ്ടമല്ല',o:['എനിക്ക് അത് ഇഷ്ടമല്ല','എനിക്ക് അത് ഇഷ്ടമാണ്','ഞാൻ അത് കൊണ്ടുവരാം','ഞാൻ അത് വായിക്കുന്നു']},
{p:'“نَنْثُرُ الرُّزَّ عَلَى الْأَرْضِ” എന്നതിന്റെ അർത്ഥം എന്ത്?',a:'നിലത്ത് അരി വിതറുന്നു',o:['നിലത്ത് അരി വിതറുന്നു','പന്ത് കളിക്കുന്നു','പുസ്തകം വായിക്കുന്നു','സ്കൂളിലേക്ക് പോകുന്നു']},
{p:'“فِكْرَةٌ رَائِعَةٌ” എന്ന പാഠത്തിന്റെ പേരിന്റെ അർത്ഥം എന്ത്?',a:'മനോഹരമായ ആശയം',o:['മനോഹരമായ ആശയം','പുതിയ പുസ്തകം','വലിയ വീട്','ചെറിയ പക്ഷി']},
{p:'പാഠത്തിലെ സംഭാഷണത്തിൽ സാലിമും ശാകിറും ആരാണ്?',a:'സഹോദരന്മാർ',o:['സഹോദരന്മാർ','അധ്യാപകരും വിദ്യാർത്ഥികളും','അച്ഛനും മകനും','അപരിചിതർ']},
{p:'ശാകിർ പക്ഷികൾക്ക് എന്താണ് നൽകാൻ പറയുന്നത്?',a:'അരി',o:['അരി','പുസ്തകം','പന്ത്','പേന']},
{p:'“مَاذَا” എന്ന വാക്കിന്റെ അർത്ഥം എന്ത്?',a:'എന്ത്',o:['എന്ത്','എവിടെ','ആര്','എങ്ങനെ']},
{p:'“هَلْ” സാധാരണയായി ഏത് തരത്തിലുള്ള ചോദ്യത്തിലാണ് ഉപയോഗിക്കുന്നത്?',a:'അതെ അല്ലെങ്കിൽ ഇല്ല എന്ന് പറയാവുന്ന ചോദ്യം',o:['അതെ അല്ലെങ്കിൽ ഇല്ല എന്ന് പറയാവുന്ന ചോദ്യം','സ്ഥലം മാത്രം ചോദിക്കാൻ','വ്യക്തിയെ മാത്രം ചോദിക്കാൻ','രീതി മാത്രം ചോദിക്കാൻ']},
{p:'വിട്ടുപോയ ഭാഗത്ത് ശരിയായ വാക്ക് തിരഞ്ഞെടുക്കുക.',ar:'........ نَفْعَلُ الْيَوْمَ؟',a:'مَاذَا',o:['مَاذَا','أَيْنَ','مَنْ','كَيْفَ']},
{p:'വിട്ടുപോയ ഭാഗത്ത് ശരിയായ വാക്ക് തിരഞ്ഞെടുക്കുക: പന്ത് എവിടെയാണ്?',ar:'........ الْكُرَةُ؟',a:'أَيْنَ',o:['أَيْنَ','مَا','هَلْ','مَنْ']},
{p:'വിട്ടുപോയ ഭാഗത്ത് ശരിയായ വാക്ക് തിരഞ്ഞെടുക്കുക: ആരാണ് അരി കൊണ്ടുവരുന്നത്?',ar:'........ يَأْتِي بِالرُّزِّ؟',a:'مَنْ',o:['مَنْ','مَاذَا','كَيْفَ','هَلْ']},
{p:'വിട്ടുപോയ ഭാഗത്ത് ശരിയായ വാക്ക് തിരഞ്ഞെടുക്കുക: നാം അവയ്ക്ക് എങ്ങനെ ഭക്ഷണം നൽകും?',ar:'........ نُطْعِمُهَا؟',a:'كَيْفَ',o:['كَيْفَ','أَيْنَ','مَا','مَنْ']},
{p:'“هَلْ تُحِبُّ إِطْعَامَ الطُّيُورِ؟” എന്ന ചോദ്യത്തിന് “അതെ” എന്ന മറുപടി ഏത്?',a:'نَعَمْ، نَعَمْ',o:['نَعَمْ، نَعَمْ','لَا أُحِبُّهَا','أَيْنَ الْكُرَةُ؟','مَنْ يَأْتِي؟']}
];
let answers={},locked={};
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function render(){const root=document.getElementById('quiz');root.innerHTML='';questions.forEach((q,i)=>{const card=document.createElement('section');card.className='quiz-card';let questionText=q.ar?`<div class="arabic"><span class="blank">........</span> ${q.ar.replace(/^\.\.\.\.\.\.\.\./,'').trim()}</div>`:'';if(q.ar==='........ يَجْمَعُونَ الأَقْلَامَ')questionText='<div class="arabic"><span class="blank">........</span> يَجْمَعُونَ الأَقْلَامَ</div>';if(q.ar==='........ تَكْتُبَانِ')questionText='<div class="arabic"><span class="blank">........</span> تَكْتُبَانِ</div>';card.innerHTML=`<div class="qtop"><span class="qnum">ചോദ്യം ${i+1} / ${questions.length}</span><span style="font-size:13px;color:#66758a">${q.ar?'വിട്ടുപോയ വാക്ക് ചേർക്കുക':'ശരിയായ ഒരു ഉത്തരം അമർത്തുക'}</span></div><div class="prompt">${q.p}</div>${questionText}<div class="options"></div><div class="feedback"><span class="light" id="light-${i}"></span><span class="msg" id="msg-${i}">ഒരു ഉത്തരം അമർത്തുക</span></div>`;const opts=card.querySelector('.options');shuffle(q.o).forEach(opt=>{const b=document.createElement('button');b.className='option';b.textContent=opt;b.dir=/[\u0600-\u06FF]/.test(opt)?'rtl':'auto';b.onclick=()=>choose(i,opt,b);opts.appendChild(b)});root.appendChild(card)});updateStats()}
function choose(i,opt,btn){if(locked[i])return;locked[i]=true;answers[i]=opt;const q=questions[i],light=document.getElementById('light-'+i),msg=document.getElementById('msg-'+i);const buttons=document.querySelectorAll('.quiz-card')[i].querySelectorAll('.option');buttons.forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add('correct')});if(opt===q.a){btn.classList.add('correct');light.className='light green';msg.textContent='ശരി! വളരെ നന്നായി.';msg.style.color='#178747'}else{btn.classList.add('wrong');light.className='light red';msg.textContent='അത് ശരിയല്ല. ശരിയായ ഉത്തരം: '+q.a;msg.style.color='#d83232'}updateStats()}
function updateStats(){const done=Object.keys(answers).length,score=Object.keys(answers).filter(k=>answers[k]===questions[k].a).length;document.getElementById('total').textContent=questions.length;document.getElementById('answered').textContent=done;document.getElementById('score').textContent=score;document.querySelector('.stat:last-child').innerHTML='സ്കോർ: <span id="score">'+score+'</span>/'+questions.length;document.getElementById('progress').style.width=(done/questions.length*100)+'%'}
function checkAll(){questions.forEach((q,i)=>{if(!locked[i]){const btn=[...document.querySelectorAll('.quiz-card')[i].querySelectorAll('.option')].find(b=>b.textContent===q.a);choose(i,q.a,btn)}})}
function resetQuiz(){answers={};locked={};render();window.scrollTo({top:0,behavior:'smooth'})}
render();
</script>
</body></html>
